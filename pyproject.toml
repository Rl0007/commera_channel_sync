[project]
name = "commera_channel_sync"
authors = [{ name = "Rahul Agrawal", email = "12agrawalrahul@gmail.com" }]
description = "Example Commera app: keeps a marketplace channel's listings in step with the storefront"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
commera = ">=1.0.0,<2.0.0"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = ["E501", "W191", "E101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
